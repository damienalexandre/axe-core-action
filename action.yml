name: 'Syntropy Axe-Core Accessibility CI'
description: 'Zero-config automated WCAG 2.1/2.2 AA accessibility audit in CI/CD with rich PR annotations and markdown summaries.'
author: 'Syntropy Digital'
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  url:
    description: 'URL to scan (e.g. http://localhost:3000 or staging URL)'
    required: true
  standard:
    description: 'Accessibility standard to enforce (wcag2a, wcag2aa, wcag21aa, wcag22aa, RGAAv4)'
    required: false
    default: 'wcag21aa'
  fail-on:
    description: 'Minimum violation severity to fail the CI build (minor, moderate, serious, critical)'
    required: false
    default: 'serious'
  output-json:
    description: 'Path to save full JSON audit report'
    required: false
    default: 'axe-results.json'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Debug Environment
      shell: bash
      run: |
        echo "=== DEBUG INFO ==="
        echo "Node.js version: $(node --version)"
        echo "npm version: $(npm --version)"
        echo "ChromeDriver path: $CHROMEWEBDRIVER/chromedriver"
        if [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
          echo "ChromeDriver version: $($CHROMEWEBDRIVER/chromedriver --version 2>&1 || echo 'unknown')"
        else
          echo "ChromeDriver not found at $CHROMEWEBDRIVER/chromedriver"
        fi
        CHROME_BIN=$(which google-chrome || which chromium-browser || which chromium || echo 'not found')
        echo "Chrome path: $CHROME_BIN"
        if [ "$CHROME_BIN" != "not found" ]; then
          echo "Chrome version: $($CHROME_BIN --version 2>&1 || echo 'unknown')"
        fi
        echo "==================="

    - name: Install dependencies
      shell: bash
      run: |
        npm install --no-save selenium-webdriver chromedriver axe-core

    - name: Run Axe Core Scanner
      shell: bash
      env:
        SCAN_URL: ${{ inputs.url }}
        STANDARD: ${{ inputs.standard }}
        FAIL_ON: ${{ inputs.fail-on }}
        OUTPUT_JSON: ${{ inputs.output-json }}
      run: |
        echo "Scanning URL: $SCAN_URL"

        # Map standard to axe-core tags
        case "$STANDARD" in
          wcag2a)   TAGS="wcag2a,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media,best-practice" ;;
          wcag2aa)  TAGS="wcag2a,wcag2aa,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media,best-practice" ;;
          wcag21a)  TAGS="wcag2a,wcag21a,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media,best-practice" ;;
          wcag21aa) TAGS="wcag2a,wcag2aa,wcag21a,wcag21aa,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media,best-practice" ;;
          wcag22a)  TAGS="wcag2a,wcag21a,wcag22a,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media,best-practice" ;;
          wcag22aa) TAGS="wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22a,wcag22aa,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media,best-practice" ;;
          rgaav4|RGAAv4) TAGS="RGAAv4,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media,best-practice" ;;
          *) echo "::error::unknown standard '$STANDARD' (use wcag2a, wcag2aa, wcag21aa, wcag22aa, or RGAAv4)"; exit 1 ;;
        esac

        echo "Using tags: $TAGS"

        # Create a Node.js script to run axe with Selenium
        cat > run_axe.js << 'EOF'
        const { Builder } = require('selenium-webdriver');
        const chrome = require('selenium-webdriver/chrome');
        const fs = require('fs');
        const path = require('path');

        (async () => {
          try {
            // Configure Chrome with SSL ignoring
            const options = new chrome.Options();
            options.setAcceptInsecureCerts(true);  // ✅ W3C capability for SSL
            options.addArguments(
              '--ignore-certificate-errors',
              '--allow-insecure-localhost',
              '--allow-running-insecure-content',
              '--headless',
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--disable-gpu'
            );

            // Set Chrome binary path
            const chromeBin = '/usr/bin/google-chrome';
            if (fs.existsSync(chromeBin)) {
              options.setChromeBinaryPath(chromeBin);
            }

            // Set ChromeDriver path if available
            const chromedriverPath = process.env.CHROMEWEBDRIVER ?
              path.join(process.env.CHROMEWEBDRIVER, 'chromedriver') :
              null;

            let driver;
            if (chromedriverPath && fs.existsSync(chromedriverPath)) {
              // Use custom ChromeDriver path
              const { ServiceBuilder } = require('selenium-webdriver/chrome');
              const service = new ServiceBuilder(chromedriverPath).build();
              driver = await new Builder()
                .forBrowser('chrome')
                .setChromeOptions(options)
                .setChromeService(service)
                .build();
            } else {
              // Use default ChromeDriver
              driver = await new Builder()
                .forBrowser('chrome')
                .setChromeOptions(options)
                .build();
            }

            console.log('Loading URL:', process.env.SCAN_URL);
            await driver.get(process.env.SCAN_URL);

            // Inject and run axe-core with the specified tags
            const axeScript = `
              var callback = arguments[arguments.length - 1];
              axe.configure({ branding: { application: 'axe-core-action' } });
              axe.run('${process.env.TAGS}').then(callback).catch(e => callback({error: e.message}));
            `;

            const results = await driver.executeAsyncScript(axeScript);

            if (results.error) {
              console.error('Axe error:', results.error);
              await driver.quit();
              process.exit(1);
            }

            // Save results
            fs.writeFileSync(process.env.OUTPUT_JSON, JSON.stringify([results]));
            console.log(`Saved results to ${process.env.OUTPUT_JSON}`);

            // Log violations
            if (results.violations && results.violations.length > 0) {
              console.log(`Found ${results.violations.length} violations:`);
              results.violations.forEach(v => {
                console.log(`- ${v.id}: ${v.impact} (${v.nodes.length} nodes)`);
              });
            } else {
              console.log('No violations found!');
            }

            await driver.quit();
          } catch (error) {
            console.error('Selenium error:', error.message);
            process.exit(1);
          }
        })();
        EOF

        # Run the script
        node run_axe.js
