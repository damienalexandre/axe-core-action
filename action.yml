name: 'Syntropy Axe-Core Accessibility CI'
description: 'Zero-config automated WCAG 2.1/2.2 AA accessibility audit in CI/CD with rich PR annotations and markdown summaries.'
author: 'Syntropy Digital'
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  url:
    description: 'URL to scan (e.g. http://localhost:3000 or staging URL)'
    required: true
  standard:
    description: 'Accessibility standard to enforce (wcag2a, wcag2aa, wcag21aa, wcag22aa, RGAAv4)'
    required: false
    default: 'wcag21aa'
  fail-on:
    description: 'Minimum violation severity to fail the CI build (minor, moderate, serious, critical)'
    required: false
    default: 'serious'
  output-json:
    description: 'Path to save full JSON audit report'
    required: false
    default: 'axe-results.json'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Axe Core Scanner
      shell: bash
      env:
        SCAN_URL: ${{ inputs.url }}
        STANDARD: ${{ inputs.standard }}
        FAIL_ON: ${{ inputs.fail-on }}
        OUTPUT_JSON: ${{ inputs.output-json }}
      run: |
        # GitHub-hosted runners expose a ChromeDriver that matches the preinstalled Chrome via
        # $CHROMEWEBDRIVER; use it when present so the driver and browser versions cannot drift.
        DRIVER_ARGS=()
        if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
          DRIVER_ARGS=(--chromedriver-path "$CHROMEWEBDRIVER/chromedriver")
        else
          # Install a compatible chromedriver version for Node.js 20
          npm uninstall chromedriver@154.0.0 --no-save 2>/dev/null || true
          npm install --no-save chromedriver@152.0.0
          DRIVER_ARGS=(--chromedriver-path "$(npm root)/chromedriver/bin/chromedriver")
        fi
        # axe runs a rule when it carries ANY listed tag, and WCAG levels are cumulative, so a
        # "wcag22aa" gate must include the 2.0/2.1 A and AA rule sets, not just the rules new in 2.2.
        case "$STANDARD" in
          wcag2a)   TAGS="wcag2a,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media" ;;
          wcag2aa)  TAGS="wcag2a,wcag2aa,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media" ;;
          wcag21a)  TAGS="wcag2a,wcag21a,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media" ;;
          wcag21aa) TAGS="wcag2a,wcag2aa,wcag21a,wcag21aa,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media" ;;
          wcag22a)  TAGS="wcag2a,wcag21a,wcag22a,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media" ;;
          wcag22aa) TAGS="wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22a,wcag22aa,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media" ;;
          rgaav4|RGAAv4) TAGS="RGAAv4,cat.aria,cat.color,cat.forms,cat.keyboard,cat.images,cat.language,cat.name-role-value,cat.parsing,cat.semantics,cat.sensory-and-visual-cues,cat.structure,cat.tables,cat.time-and-media" ;;
          *) echo "::error::unknown standard '$STANDARD' (use wcag2a, wcag2aa, wcag21aa, wcag22aa, or RGAAv4)"; exit 1 ;;
        esac
        npx --yes @axe-core/cli@4.9.1 "$SCAN_URL" --tags "$TAGS" --save "$OUTPUT_JSON" --chromedriver-path "$(npm root)/chromedriver/bin/chromedriver" --chrome-options="acceptInsecureCerts=true" "${DRIVER_ARGS[@]}" || true
        node "${{ github.action_path }}/dist/summary.js" "$OUTPUT_JSON" "$FAIL_ON"
